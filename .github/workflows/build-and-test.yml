name: Build and Test

on:
push:
pull_request:
branches:
- main

jobs:
build-and-test:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: '10.0.x'

  - name: Restore
    run: dotnet restore Lab1CorpRaz.sln

  - name: Build
    run: dotnet build Lab1CorpRaz.sln --no-restore

  - name: Test
    run: dotnet test Lab1CorpRaz.sln --no-build
